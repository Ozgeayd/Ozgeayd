<svg width="500" height="110" viewBox="0 0 500 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- İnce ve Yuvarlatılmış Üst Çubuk (Yükseklik: 8px) -->
  <defs>
    <clipPath id="rounded-bar">
      <rect x="0" y="5" width="500" height="8" rx="4" />
    </clipPath>
  </defs>
  
  <g clip-path="url(#rounded-bar)">
    <rect x="0" y="5" width="200" height="8" fill="#3572A5" />   <!-- Python %40 -->
    <rect x="200" y="5" width="100" height="8" fill="#A97BFF" /> <!-- Kotlin %20 -->
    <rect x="300" y="5" width="50" height="8" fill="#178600" />  <!-- C# %10 -->
    <rect x="350" y="5" width="50" height="8" fill="#f1e05a" />  <!-- JS %10 -->
    <rect x="400" y="5" width="50" height="8" fill="#e34c26" />  <!-- HTML5 %10 -->
    <rect x="450" y="5" width="50" height="8" fill="#563d7c" />  <!-- CSS3 %10 -->
  </g>

  <!-- Alt Kısım: İki Sütunlu Zarif Liste (Arka Plan Şeffaf) -->
  <g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13">
    <!-- Sol Sütun -->
    <circle cx="6" cy="36" r="4.5" fill="#3572A5" />
    <text x="18" y="40" fill="#c9d1d9" font-weight="600">Python</text>
    <text x="185" y="40" fill="#8b949e">40%</text>

    <circle cx="6" cy="60" r="4.5" fill="#A97BFF" />
    <text x="18" y="64" fill="#c9d1d9" font-weight="600">Kotlin</text>
    <text x="185" y="64" fill="#8b949e">20%</text>

    <circle cx="6" cy="84" r="4.5" fill="#178600" />
    <text x="18" y="88" fill="#c9d1d9" font-weight="600">C#</text>
    <text x="185" y="88" fill="#8b949e">10%</text>

    <!-- Sağ Sütun -->
    <circle cx="266" cy="36" r="4.5" fill="#f1e05a" />
    <text x="278" y="40" fill="#c9d1d9" font-weight="600">JavaScript</text>
    <text x="455" y="40" fill="#8b949e">10%</text>

    <circle cx="266" cy="60" r="4.5" fill="#e34c26" />
    <text x="278" y="64" fill="#c9d1d9" font-weight="600">HTML5</text>
    <text x="455" y="64" fill="#8b949e">10%</text>

    <circle cx="266" cy="84" r="4.5" fill="#563d7c" />
    <text x="278" y="88" fill="#c9d1d9" font-weight="600">CSS3</text>
    <text x="455" y="88" fill="#8b949e">10%</text>
  </g>
</svg>
